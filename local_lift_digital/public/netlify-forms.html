<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Netlify form declarations</title>
  </head>
  <body>
    <form name="agency-contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="agency-contact">
      <input type="text" name="bot-field">
      <input type="text" name="full-name">
      <input type="text" name="business-name">
      <input type="email" name="email-address">
      <input type="tel" name="phone-number">
      <select name="service-needed">
        <option value="Website Design">Website Design</option>
        <option value="Google Business Profile">Google Business Profile</option>
        <option value="AI Automation">AI Automation</option>
        <option value="Custom Business Applications">Custom Business Applications</option>
        <option value="Other">Other</option>
      </select>
    </form>

    <form name="homepage-lead" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="homepage-lead">
      <input type="text" name="bot-field">
      <input type="text" name="full-name">
      <input type="text" name="business-name">
      <input type="tel" name="phone">
      <input type="email" name="email">
      <select name="main-goal">
        <option value="New Website">New Website</option>
        <option value="GMB Growth">GMB Growth</option>
        <option value="AI Assistants">AI Assistants</option>
      </select>
    </form>

    <form name="services-strategy-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="services-strategy-request">
      <input type="text" name="bot-field">
      <input type="text" name="firstName">
      <input type="text" name="businessType">
      <input type="url" name="websiteUrl">
      <input type="tel" name="phone">
    </form>

    <form name="newsletter-sub" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="newsletter-sub">
      <input type="text" name="bot-field">
      <input type="email" name="email">
    </form>
  </body>
</html>
